<h1>TAME 发薪日航线支持</h1>
<p>发薪日航线是一款本地发薪周期规划计算工具，不连接银行，也不会转移资金。</p>
<h2>如何恢复购买？</h2>
<p>从周期设置打开解锁页面，点击“恢复购买”。请使用购买时使用的 Apple 账户。</p>
<h2>我的数据在哪里？</h2>
<p>你的周期、账单和手动支出保存在设备本地，不会上传到我们的服务器。</p>
<h2>为什么可安全支出金额变化了？</h2>
<p>这个数字会扣除当前周期中已填写的账单、缓冲和手动支出。如果数字不符合预期，请检查周期设置。</p>
<h2>联系我们</h2>
<p>请发送邮件至 <a href="mailto:pengpengemail@gmail.com">pengpengemail@gmail.com</a>，并附上应用版本、设备型号、iOS 版本和问题描述。请不要发送银行密码或银行卡信息。</p>
